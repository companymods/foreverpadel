<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forever Padel</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           PAGE
        ========================================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f8fa 0%,
                    #ffffff 50%,
                    #eef3f6 100%
                );

            color: #263238;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* =========================================
           CONTENEUR PRINCIPAL
        ========================================= */

        .container {

            width: 100%;
            max-width: 1050px;

            text-align: center;

            background: rgba(255,255,255,0.94);

            border-radius: 24px;

            padding: 45px 50px 55px;

            box-shadow:
                0 20px 60px rgba(60,80,90,0.12);

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            display: block;

            width: 330px;
            max-width: 75%;

            height: auto;

            margin: 0 auto 25px;

        }


        /* =========================================
           TITRE
        ========================================= */

        h1 {

            font-size: 38px;

            font-weight: 700;

            letter-spacing: 5px;

            color: #263238;

            margin-bottom: 12px;

        }


        .subtitle {

            font-size: 16px;

            color: #78909c;

            letter-spacing: 1px;

            margin-bottom: 40px;

        }


        /* =========================================
           TITRE DES TOURNOIS
        ========================================= */

        .section-title {

            font-size: 18px;

            font-weight: 600;

            color: #455a64;

            letter-spacing: 1px;

            margin-bottom: 22px;

        }


        /* =========================================
           GRILLE DES BOUTONS
        ========================================= */

        .teams-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            max-width: 850px;

            margin: 0 auto;

        }


        /* =========================================
           BOUTONS
        ========================================= */

        .team-button {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 68px;

            padding: 15px 20px;

            text-decoration: none;

            color: #455a64;

            background: #ffffff;

            border: 1px solid #cfd8dc;

            border-radius: 12px;

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 1px;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        /* =========================================
           SURVOL DES BOUTONS NORMAUX
        ========================================= */

        .team-button:hover {

            transform: translateY(-3px);

            background: #90a4ae;

            color: #ffffff;

            border-color: #90a4ae;

            box-shadow:
                0 8px 20px rgba(69,90,100,0.18);

        }


        /* =========================================
           BOUTONS MIS EN SURBRILLANCE
           12 / 16 / 24 ÉQUIPES
        ========================================= */

        .team-button.featured {

            background: #90a4ae;

            color: #ffffff;

            border-color: #90a4ae;

            box-shadow:
                0 8px 22px rgba(69,90,100,0.20);

        }


        /* Petit indicateur "POPULAIRE" */

        .team-button.featured::before {

            content: "POPULAIRE";

            position: absolute;

            top: -9px;
            right: 15px;

            padding: 4px 9px;

            border-radius: 20px;

            background: #ffffff;

            border: 1px solid #90a4ae;

            color: #78909c;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        /* =========================================
           HOVER DES BOUTONS EN SURBRILLANCE
        ========================================= */

        .team-button.featured:hover {

            background: #78909c;

            border-color: #78909c;

            transform: translateY(-4px);

            box-shadow:
                0 12px 28px rgba(69,90,100,0.25);

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: 42px;

            padding-top: 22px;

            border-top:
                1px solid #e3e8eb;

            color: #90a4ae;

            font-size: 12px;

            letter-spacing: 1px;

        }


        /* =========================================
           VERSION TABLETTE
        ========================================= */

        @media (max-width: 750px) {

            .container {

                padding:
                    35px 25px 40px;

            }


            .logo {

                width: 280px;

            }


            h1 {

                font-size: 30px;

            }


            .teams-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =========================================
           VERSION MOBILE
        ========================================= */

        @media (max-width: 500px) {

            body {

                padding: 20px 12px;

            }


            .container {

                padding:
                    30px 18px 35px;

                border-radius: 18px;

            }


            .logo {

                width: 250px;

                max-width: 90%;

            }


            h1 {

                font-size: 24px;

                letter-spacing: 3px;

            }


            .subtitle {

                font-size: 13px;

                margin-bottom: 32px;

            }


            .teams-grid {

                grid-template-columns: 1fr;

                gap: 13px;

            }


            .team-button {

                min-height: 60px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- =====================================
             LOGO
        ====================================== -->

        <img
            src="logo.png"
            alt="Forever Padel"
            class="logo"
        >


        <!-- =====================================
             TITRE
        ====================================== -->

        <h1>
            FOREVER PADEL
        </h1>


        <p class="subtitle">
            Organisez facilement vos tournois de padel
        </p>


        <!-- =====================================
             CHOIX DU NOMBRE D'ÉQUIPES
        ====================================== -->

        <h2 class="section-title">
            Choisissez le nombre d'équipes
        </h2>


        <div class="teams-grid">


            <!-- 8 ÉQUIPES -->

            <a
                href="8-equipes.html"
                class="team-button"
            >
                8 ÉQUIPES
            </a>


            <!-- 10 ÉQUIPES -->

            <a
                href="10-equipes.html"
                class="team-button"
            >
                10 ÉQUIPES
            </a>


            <!-- 12 ÉQUIPES -->

            <a
                href="12-equipes.html"
                class="team-button featured"
            >
                12 ÉQUIPES
            </a>


            <!-- 14 ÉQUIPES -->

            <a
                href="14-equipes.html"
                class="team-button"
            >
                14 ÉQUIPES
            </a>


            <!-- 16 ÉQUIPES -->

            <a
                href="16-equipes.html"
                class="team-button featured"
            >
                16 ÉQUIPES
            </a>


            <!-- 18 ÉQUIPES -->

            <a
                href="18-equipes.html"
                class="team-button"
            >
                18 ÉQUIPES
            </a>


            <!-- 20 ÉQUIPES -->

            <a
                href="20-equipes.html"
                class="team-button"
            >
                20 ÉQUIPES
            </a>


            <!-- 22 ÉQUIPES -->

            <a
                href="22-equipes.html"
                class="team-button"
            >
                22 ÉQUIPES
            </a>


            <!-- 24 ÉQUIPES -->

            <a
                href="24-equipes.html"
                class="team-button featured"
            >
                24 ÉQUIPES
            </a>


        </div>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <div class="footer">

            FOREVER PADEL
            <br>
            Organisation de tournois

        </div>


    </main>


</body>

</html>
